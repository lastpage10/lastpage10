<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="SlideShelf">
  <rect width="64" height="64" rx="14" fill="#0F6B56"/>
  <!-- back slide -->
  <rect x="18" y="14" width="28" height="34" rx="4" fill="#FFFFFF" opacity="0.55" transform="rotate(-14 32 31)"/>
  <!-- middle slide -->
  <rect x="18" y="14" width="28" height="34" rx="4" fill="#FFFFFF" opacity="0.8" transform="rotate(-7 32 31)"/>
  <!-- front slide -->
  <rect x="18" y="14" width="28" height="34" rx="4" fill="#FFFFFF"/>
  <!-- amber accent tab -->
  <rect x="34" y="38" width="10" height="5" rx="2.5" fill="#E07A2F"/>
</svg>
